syntax = "proto3";

// Package common.v1 общие структуры
package common.v1;

import "google/protobuf/timestamp.proto";
import "common/v1/session.proto";

option go_package = "github.com/kirillmc/starShipsCompany/shared/pkg/proto/common/v1;common_v1";

// User
message User {
  string uuid = 1;
  UserInfo info = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

// UserInfo
message UserInfo{
  string login = 1;
  string email = 2;

  //Каналы уведомлений
  repeated  NotificationMethod notification_methods = 3;
}