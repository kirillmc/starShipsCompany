syntax = "proto3";

// Package common.v1 общие структуры
package common.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/kirillmc/starShipsCompany/shared/pkg/proto/common/v1;common_v1";

// Session - сессия
message Session{
  string uuid = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// NotificationMethod
message NotificationMethod{
  // Провайдер: telegram, email, push и т.д.
  string provider_name = 1;

  // Адрес/идентификатор назначения (email, чат-id)
  string target = 2;
}